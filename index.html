<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Order reconciliation — Okonkwo, Daniel</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2316323f'/%3E%3Cpath d='M3 4h10M3 8h10M3 12h6' stroke='%23e4ebe4' stroke-width='1.5'/%3E%3Cpath d='M11 12l4-4' stroke='%23a34509' stroke-width='1.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;450;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --drape: #e4ebe4;
    --sheet: #fbfcfa;
    --ink: #16323f;
    --ink-soft: #4a6572;
    --rule: #c2cfc6;
    --open: #a34509;
    --open-wash: #f7ece3;
    --placed: #2f6b4f;
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --serif: "Source Serif 4", Georgia, serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--drape);
    color: var(--ink);
    font: 400 15px/1.5 var(--sans);
    -webkit-font-smoothing: antialiased;
  }

  /* ---- patient banner ---- */
  .banner {
    background: var(--ink);
    color: #dbe5dc;
    padding: 11px clamp(16px, 3vw, 34px);
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 6px 26px;
  }
  .banner h1 {
    font: 600 17px/1.2 var(--sans);
    letter-spacing: .01em;
    margin: 0;
    color: #fff;
  }
  .banner dl { display: flex; gap: 26px; margin: 0; flex-wrap: wrap; }
  .banner div { display: flex; gap: 7px; align-items: baseline; }
  .banner dt { color: #8fa79b; font-size: 12.5px; }
  .banner dd { margin: 0; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  .banner .allergy dd { color: #f0b48a; }
  .banner code { font: 400 13px/1 var(--mono); }

  /* ---- shell ---- */
  main {
    max-width: 1280px;
    margin: 0 auto;
    padding: clamp(16px, 2.4vw, 30px);
    display: grid;
    grid-template-columns: minmax(0, 1.12fr) minmax(0, .88fr);
    gap: clamp(16px, 2vw, 26px);
    align-items: start;
  }
  @media (max-width: 960px) { main { grid-template-columns: 1fr; } }

  .pane { background: var(--sheet); border: 1px solid var(--rule); }
  .pane > header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 14px;
    padding: 13px 18px;
    border-bottom: 1px solid var(--rule);
  }
  .pane > header h2 { font: 500 14.5px/1 var(--sans); margin: 0; }
  .unsigned {
    font-size: 12px;
    color: var(--open);
    border: 1px solid #ddc0a8;
    background: var(--open-wash);
    padding: 3px 8px;
    border-radius: 2px;
  }

  /* ---- the note ---- */
  .note-body { padding: 26px clamp(20px, 3vw, 40px) 30px; border-left: 3px solid var(--rule); }
  .note-body p {
    font: 400 18.5px/1.62 var(--serif);
    margin: 0 0 1.05em;
    max-width: 66ch;
  }
  .note-body p:last-child { margin-bottom: 0; }

  /* a sentence carrying a commitment the chart has not honoured */
  .flag {
    background-image: linear-gradient(var(--open), var(--open));
    background-repeat: no-repeat;
    background-position: 0 1.22em;
    background-size: 0% 1.5px;
    transition: background-size .5s cubic-bezier(.2, .7, .3, 1);
    transition-delay: var(--d, 0s);
    cursor: help;
  }
  .revealed .flag { background-size: 100% 1.5px; }
  .flag.lit { background-color: var(--open-wash); }

  textarea {
    display: block;
    width: 100%;
    min-height: 320px;
    overflow: hidden;
    border: none;
    padding: 26px clamp(20px, 3vw, 40px);
    border-left: 3px solid var(--open);
    background: #fff;
    color: var(--ink);
    font: 400 17px/1.6 var(--serif);
    resize: vertical;
  }
  textarea:focus { outline: 2px solid var(--ink); outline-offset: -2px; }

  /* ---- buttons ---- */
  button {
    font: 450 13.5px/1 var(--sans);
    border-radius: 3px;
    border: 1px solid var(--ink);
    background: var(--ink);
    color: #fff;
    padding: 9px 15px;
    cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
  button.ghost:hover { border-color: var(--ink); }
  button.add { padding: 6px 11px; font-size: 12.5px; background: transparent; color: var(--open); border-color: #ddc0a8; }
  button.add:hover { background: var(--open); color: #fff; border-color: var(--open); }
  button:disabled { opacity: .45; cursor: default; }
  button:focus-visible { outline: 2px solid var(--open); outline-offset: 2px; }

  /* ---- order sheet ---- */
  .sheet-section { padding: 15px 18px 18px; border-bottom: 1px solid var(--rule); }
  .sheet-section:last-child { border-bottom: none; }
  .sheet-section > h3 { font: 500 12.5px/1 var(--sans); color: var(--ink-soft); margin: 0 0 11px; }

  ul.orders { list-style: none; margin: 0; padding: 0; }
  ul.orders li {
    display: grid;
    grid-template-columns: 15px minmax(0, 1fr) auto;
    gap: 10px;
    align-items: baseline;
    padding: 8px 0;
    border-bottom: 1px solid #edf1ec;
  }
  ul.orders li:last-child { border-bottom: none; }
  .glyph { font-size: 13px; line-height: 1.35; }
  .glyph.ok { color: var(--placed); }
  .glyph.gap { color: var(--open); }
  .label { font-size: 14.5px; }
  .code { display: block; font: 400 11.5px/1.5 var(--mono); color: var(--ink-soft); }
  .p { font: 400 12.5px/1 var(--mono); color: var(--ink-soft); font-variant-numeric: tabular-nums; }

  .nudge-head {
    font: 400 19px/1.4 var(--serif);
    margin: 0 0 14px;
    max-width: 40ch;
  }
  .nudge-head b { font-weight: 600; color: var(--open); }
  .resolved .nudge-head b { color: var(--placed); }
  .empty { color: var(--ink-soft); font-size: 13.5px; max-width: 42ch; margin: 0; }

  .row-enter { animation: rise .34s both cubic-bezier(.2, .7, .3, 1); }
  @keyframes rise { from { opacity: 0; transform: translateY(5px); } }

  .aside { font-size: 12.5px; color: var(--ink-soft); margin: 9px 0 0; max-width: 44ch; }
  .meta {
    padding: 11px 18px;
    font: 400 11.5px/1.7 var(--mono);
    color: var(--ink-soft);
    background: #f4f7f3;
    border-top: 1px solid var(--rule);
  }
  .err { color: var(--open); font-size: 13.5px; margin: 0; }

  /* shown only on the static Pages copy, which replays one recorded response */
  .strip {
    margin: 0;
    padding: 9px clamp(16px, 3vw, 34px);
    background: var(--open-wash);
    border-bottom: 1px solid #ddc0a8;
    color: #6b3a14;
    font-size: 13px;
  }
  .strip a { color: inherit; text-decoration-thickness: 1px; }

  /* the working-out, folded away until asked for */
  details.explain { border-top: 1px solid var(--rule); background: #f8faf7; }
  details.explain > summary {
    padding: 12px 18px;
    font: 500 12.5px/1 var(--sans);
    color: var(--ink-soft);
    cursor: pointer;
  }
  details.explain[open] > summary { color: var(--ink); }
  details.explain > summary:focus-visible { outline: 2px solid var(--open); outline-offset: -2px; }
  .explain-body { padding: 2px 18px 20px; }
  .explain-body h4 { font: 500 12.5px/1 var(--sans); color: var(--ink-soft); margin: 18px 0 8px; }
  .explain-body h4:first-child { margin-top: 6px; }
  .explain-body p { font-size: 13px; line-height: 1.55; max-width: 48ch; margin: 0 0 9px; }
  pre.mono {
    font: 400 11px/1.6 var(--mono);
    background: #fff;
    border: 1px solid var(--rule);
    padding: 10px 11px;
    margin: 0 0 9px;
    overflow-x: auto;
    color: var(--ink);
  }
  pre.mono.wrap { white-space: pre-wrap; word-break: break-word; }
  .rowright { display: flex; align-items: baseline; gap: 11px; }

  /* shown only when the server has no key of its own */
  .keyform label { display: block; font-size: 13px; margin-bottom: 7px; }
  .keyform input {
    width: 100%;
    font: 400 12.5px/1 var(--mono);
    padding: 8px 9px;
    border: 1px solid var(--rule);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
  }
  .keyform input:focus { outline: 2px solid var(--ink); outline-offset: -2px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  @media (prefers-reduced-motion: reduce) {
    .flag { transition: none; }
    .row-enter { animation: none; }
  }
</style>
</head>
<body>

<div class="banner">
  <h1 id="pt-name">—</h1>
  <dl>
    <div><dt>MRN</dt><dd><code id="pt-mrn"></code></dd></div>
    <div><dt>Age</dt><dd id="pt-age"></dd></div>
    <div><dt>Born</dt><dd id="pt-dob"></dd></div>
    <div><dt>Weight</dt><dd id="pt-wt"></dd></div>
    <div><dt>Location</dt><dd id="pt-loc"></dd></div>
    <div><dt>Arrived</dt><dd id="pt-arr"></dd></div>
    <div class="allergy"><dt>Allergies</dt><dd id="pt-alg"></dd></div>
  </dl>
</div>

<p class="strip" id="strip" hidden></p>

<main>
  <section class="pane" aria-labelledby="note-h">
    <header>
      <h2 id="note-h">Progress note</h2>
      <div style="display:flex;gap:8px;align-items:center">
        <span class="unsigned">Unsigned</span>
        <button id="edit-btn" class="ghost" hidden>Edit note</button>
        <button id="check-btn">Check note against orders</button>
      </div>
    </header>
    <div id="note-host"></div>
  </section>

  <section class="pane" aria-labelledby="ord-h">
    <header><h2 id="ord-h">Orders</h2></header>

    <div class="sheet-section keyform" id="key-host" hidden></div>

    <div class="sheet-section">
      <h3>On the chart</h3>
      <ul class="orders" id="chart-list"></ul>
    </div>

    <div class="sheet-section" id="nudge-host" aria-live="polite">
      <p class="empty">Nothing checked yet. Check the note to see whether the chart carries out what it says.</p>
    </div>

    <div class="sheet-section" id="declined-host" hidden></div>
    <div id="explain-host" hidden></div>
    <div class="meta" id="meta" hidden></div>
  </section>
</main>

<script>
const WORDS = ["no", "one", "two", "three", "four", "five", "six", "seven", "eight",
               "nine", "ten", "eleven", "twelve", "thirteen", "fourteen", "fifteen"];
const word = n => WORDS[n] ?? String(n);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
// Several order names contain a comma ("ECG, 12-lead"), which makes a comma-joined
// list unreadable. Semicolons when that happens.
const listNames = names => names.join(names.some(n => n.includes(",")) ? "; " : ", ");
const el = (t, c) => { const n = document.createElement(t); if (c) n.className = c; return n; };

const state = {
  patient: {}, note: "", placed: [], catalog: {}, result: null,
  mode: "edit",
  live: true,      // false when this is the static copy with no server behind it
  recorded: null,  // the saved response, in static mode
  needsKey: false, // server is running but has no key of its own
  apiKey: "",      // held in this tab only, never stored
};

// ---- boot -----------------------------------------------------------------
// The same file serves two situations: with app.py behind it, and as a static
// page on GitHub Pages. The Pages build sets window.STATIC, so the published page
// goes straight to the recording; asking the server is the fallback for anyone
// opening this file without one.
(async function boot() {
  if (!window.STATIC) {
    try {
      const res = await fetch("/api/case");
      if (!res.ok) throw new Error("no server");
      const c = await res.json();
      state.needsKey = !!c.needs_key;
      start(c);
      if (state.needsKey) renderKeyForm();
      return;
    } catch {
      /* fall through to the recording */
    }
  }
  const ex = await (await fetch("./example.json")).json();
  state.live = false;
  state.recorded = ex;
  state.mode = "prose";
  start(ex.case);
  const strip = document.getElementById("strip");
  strip.hidden = false;
  strip.innerHTML = `This page is static, so it replays one real response recorded on `
    + `${ex.recorded_at} — the probabilities and timings below came back from the model, `
    + `unedited. Checking a note you write needs a server holding the API key: `
    + `<a href="https://github.com/ygivenx/jev-try#run-it-in-codespaces">run it in a Codespace</a>.`;
  // Keep one name for the action everywhere it is referred to.
  document.getElementById("check-btn").textContent = "Show the saved check";
  document.getElementById("nudge-host").innerHTML = '<p class="empty">Nothing shown yet. '
    + 'Show the saved check to see whether the chart carries out what the note says.</p>';
})();

function start(c) {
  state.patient = c.patient;
  state.note = c.note;
  state.placed = c.placed.slice();
  c.catalog.forEach(o => state.catalog[o.code] = o.label);
  const p = c.patient;
  const set = (id, v) => document.getElementById(id).textContent = v;
  set("pt-name", p.name); set("pt-mrn", p.mrn); set("pt-age", p.age_sex);
  set("pt-dob", p.dob); set("pt-wt", p.weight); set("pt-loc", p.location);
  set("pt-arr", p.arrived); set("pt-alg", p.allergies);
  renderNote();
  renderChart();
}

function renderKeyForm() {
  const host = document.getElementById("key-host");
  host.hidden = false;
  const label = el("label");
  label.setAttribute("for", "key-input");
  label.textContent = "This server has no TypeSafe key. Paste yours to run a check.";
  const input = el("input");
  input.id = "key-input";
  input.type = "password";
  input.autocomplete = "off";
  input.spellcheck = false;
  input.placeholder = "apikey_…";
  input.addEventListener("input", () => state.apiKey = input.value.trim());
  const hint = el("p", "aside");
  hint.textContent = "Kept in this browser tab only and sent to your own server for the "
    + "request. It is not saved anywhere and it is not sent to anyone else.";
  host.append(label, input, hint);
}

// ---- the note -------------------------------------------------------------
function flaggedSentences() {
  const map = new Map();
  (state.result?.missing ?? []).forEach(r => {
    if (!r.sentence_id) return;
    if (!map.has(r.sentence_id)) map.set(r.sentence_id, []);
    map.get(r.sentence_id).push(r.label);
  });
  return map;
}

function renderNote() {
  const host = document.getElementById("note-host");
  host.textContent = "";

  if (state.mode === "edit") {
    const ta = el("textarea");
    ta.value = state.note;
    ta.setAttribute("aria-label", "Progress note");
    const grow = () => {
      ta.style.height = "auto";
      ta.style.height = ta.scrollHeight + "px";
    };
    ta.addEventListener("input", () => { state.note = ta.value; grow(); });
    host.append(ta);
    grow();
    return;
  }

  // "prose" is the static copy before the saved check is shown: the note as
  // written, nothing marked yet.
  const flags = state.result ? flaggedSentences() : new Map();
  const paragraphs = state.result?.paragraphs ?? state.recorded.check.paragraphs;
  const body = el("div", "note-body");
  let i = 0;
  paragraphs.forEach(para => {
    const p = el("p");
    para.forEach((s, j) => {
      if (flags.has(s.id)) {
        const mark = el("span", "flag");
        mark.textContent = s.text;
        mark.style.setProperty("--d", (i++ * 0.08) + "s");
        const orders = flags.get(s.id);
        mark.title = orders.length > 1
          ? `Committed here, not on the chart: ${orders.join("; ")}`
          : `Committed here, not on the chart: ${orders[0]}`;
        mark.dataset.sid = s.id;
        p.append(mark);
      } else {
        p.append(document.createTextNode(s.text));
      }
      if (j < para.length - 1) p.append(document.createTextNode(" "));
    });
    body.append(p);
  });
  host.append(body);
  requestAnimationFrame(() => body.classList.add("revealed"));
}

// ---- the order sheet ------------------------------------------------------
function orderRow({ glyph, glyphClass, label, code, right, note }) {
  const li = el("li");
  const g = el("span", "glyph " + (glyphClass || ""));
  g.textContent = glyph;
  g.setAttribute("aria-hidden", "true");
  const mid = el("div");
  const l = el("span", "label");
  l.textContent = label;
  mid.append(l);
  const c = el("code", "code");
  c.textContent = code + (note ? "   " + note : "");
  mid.append(c);
  li.append(g, mid, right ?? el("span"));
  return li;
}

const BUCKETS = ["missing", "uncertain", "matched", "undocumented", "declined", "silent"];

// Every order carries its two probabilities whichever bucket it landed in.
function resultRow(code) {
  if (!state.result) return null;
  for (const b of BUCKETS) {
    const hit = (state.result[b] ?? []).find(r => r.code === code);
    if (hit) return hit;
  }
  return null;
}

function probSpan(value, title) {
  const p = el("span", "p");
  p.textContent = value.toFixed(2);
  p.title = title;
  return p;
}

function renderChart() {
  const list = document.getElementById("chart-list");
  list.textContent = "";
  const undoc = new Set((state.result?.undocumented ?? []).map(r => r.code));
  state.placed.forEach(code => {
    const row = resultRow(code);
    list.append(orderRow({
      glyph: undoc.has(code) ? "!" : "✓",
      glyphClass: undoc.has(code) ? "gap" : "ok",
      label: state.catalog[code] ?? code,
      code,
      note: undoc.has(code) ? "not in the note" : "",
      right: row ? probSpan(row.committed, "how strongly the note commits to this order") : null,
    }));
  });
}

function addOrder(code) {
  if (!state.placed.includes(code)) state.placed.push(code);
  // Move it rather than drop it: it really is matched now, and keeping the row
  // means the chart can still show what the note said about it.
  const row = state.result.missing.find(r => r.code === code)
           ?? state.result.uncertain.find(r => r.code === code);
  state.result.missing = state.result.missing.filter(r => r.code !== code);
  state.result.uncertain = state.result.uncertain.filter(r => r.code !== code);
  if (row && !state.result.matched.some(r => r.code === code)) {
    row.bucket = "matched";
    row.on_chart = true;
    state.result.matched.push(row);
  }
  renderChart();
  renderNudge();
  renderNote();
}

function renderNudge() {
  const host = document.getElementById("nudge-host");
  host.textContent = "";
  const { missing, uncertain, undocumented } = state.result;

  const head = el("p", "nudge-head");
  if (missing.length === 0) {
    host.classList.add("resolved");
    head.innerHTML = `<b>The chart now carries out the note.</b>`;
    host.append(head);
  } else {
    host.classList.remove("resolved");
    const n = missing.length;
    head.innerHTML = `<b>${cap(word(n))} order${n === 1 ? "" : "s"}</b> ${n === 1 ? "is" : "are"} `
      + `committed in this note but ${n === 1 ? "is" : "are"} not on the chart.`;
    host.append(head);

    const ul = el("ul", "orders");
    missing.forEach((r, i) => {
      const btn = el("button", "add");
      btn.textContent = "Add";
      btn.addEventListener("click", () => addOrder(r.code));
      const right = el("div", "rowright");
      right.append(probSpan(r.committed, "how strongly the note commits to this order"), btn);
      const row = orderRow({
        glyph: "+", glyphClass: "gap", label: r.label, code: r.code, right,
        note: r.sentence_id ? "from " + r.sentence_id : "no sentence identified",
      });
      if (r.locate_top && r.locate_top.length > 1) {
        const [best, next] = r.locate_top;
        row.title = `Committed at ${r.committed.toFixed(2)}, mentioned at ${r.mentioned.toFixed(2)}. `
          + `Sentence ${best[0]} chosen at ${best[1].toFixed(2)}, next best ${next[0]} at ${next[1].toFixed(2)}.`;
      }
      row.classList.add("row-enter");
      row.style.animationDelay = (i * 0.045) + "s";
      row.addEventListener("mouseenter", () => lightSentence(r.sentence_id, true));
      row.addEventListener("mouseleave", () => lightSentence(r.sentence_id, false));
      ul.append(row);
    });
    host.append(ul);

    const all = el("button");
    all.textContent = `Add all ${word(n)} order${n === 1 ? "" : "s"}`;
    all.style.marginTop = "13px";
    all.addEventListener("click", () => missing.slice().forEach(r => addOrder(r.code)));
    host.append(all);
  }

  if (uncertain.length) {
    const h = el("h3");
    h.textContent = "Possibly committed — read these yourself";
    h.style.margin = "20px 0 9px";
    host.append(h);
    const ul = el("ul", "orders");
    uncertain.forEach(r => {
      const btn = el("button", "add");
      btn.textContent = "Add";
      btn.addEventListener("click", () => addOrder(r.code));
      const right = el("div", "rowright");
      right.append(probSpan(r.committed, "how strongly the note commits to this order"), btn);
      ul.append(orderRow({ glyph: "?", label: r.label, code: r.code, right }));
    });
    host.append(ul);
  }

  if (undocumented.length) {
    const p = el("p", "aside");
    const names = listNames(undocumented.map(r => r.label));
    p.textContent = `${names} ${undocumented.length === 1 ? "is" : "are"} on the chart but `
      + `${undocumented.length === 1 ? "does" : "do"} not appear in the note. Document before signing.`;
    host.append(p);
  }

  // The quiet majority. Worth showing once, so it is clear the whole catalogue
  // was asked about and most of it simply had nothing to say.
  const silent = state.result.silent ?? [];
  if (silent.length) {
    const p = el("p", "aside");
    const one = silent.length === 1;
    p.textContent = cap(`${word(silent.length)} other order${one ? "" : "s"} in the catalogue `)
      + `${one ? "was" : "were"} checked and the note neither commits to ${one ? "it" : "them"} `
      + `nor mentions ${one ? "it" : "them"}: ${listNames(silent.map(r => r.label))}.`;
    host.append(p);
  }
}

function lightSentence(sid, on) {
  if (!sid) return;
  document.querySelectorAll(`.flag[data-sid="${sid}"]`)
    .forEach(n => n.classList.toggle("lit", on));
}

function renderDeclined() {
  const host = document.getElementById("declined-host");
  const rows = state.result.declined;
  host.hidden = rows.length === 0;
  if (!rows.length) return;
  host.textContent = "";
  const h = el("h3");
  h.textContent = "Named in the note, deliberately not ordered";
  host.append(h);
  const ul = el("ul", "orders");
  rows.forEach(r => {
    const p = el("span", "p");
    p.textContent = `${r.mentioned.toFixed(2)} / ${r.committed.toFixed(2)}`;
    p.title = "probability mentioned / probability committed";
    ul.append(orderRow({ glyph: "–", label: r.label, code: r.code, right: p }));
  });
  host.append(ul);
  const note = el("p", "aside");
  note.textContent = "Each of these is named in the plan and each was read as declined, "
    + "held or not indicated, so no order is suggested. The two numbers are how strongly "
    + "the note refers to it, against how strongly it commits to it.";
  host.append(note);
}

const BUCKET_RULES = {
  missing: "committed, and not on the chart",
  matched: "committed, and already on the chart",
  uncertain: "too close to call, so shown rather than nudged",
  undocumented: "on the chart, but the note does not commit to it",
  declined: "mentioned, then declined, held or ruled out",
  silent: "neither committed nor mentioned",
};

function renderExplainer() {
  const host = document.getElementById("explain-host");
  const r = state.result;
  if (!r.thresholds || !r.asked) { host.hidden = true; return; }
  host.hidden = false;
  host.textContent = "";

  const d = el("details", "explain");
  const summary = el("summary");
  summary.textContent = "How this was judged";
  d.append(summary);
  const body = el("div", "explain-body");
  const h = text => { const n = el("h4"); n.textContent = text; body.append(n); };
  const p = text => { const n = el("p"); n.textContent = text; body.append(n); };
  const pre = (text, wrap) => {
    const n = el("pre", "mono" + (wrap ? " wrap" : ""));
    n.textContent = text;
    body.append(n);
  };

  const t = r.thresholds;
  h("Two questions per order, then arithmetic");
  p(`Every order in the catalogue gets the same pair of questions about the note: `
    + `does the plan commit to it, and does the note refer to it at all. Both come back `
    + `as probabilities. Nothing after that is the model's decision.`);
  p(`At or above ${t.committed_firm.toFixed(2)} committed counts as a commitment. `
    + `Between ${t.committed_maybe.toFixed(2)} and ${t.committed_firm.toFixed(2)} is too `
    + `close to act on, so it is shown for you to read instead of nudged. Below that, `
    + `an order still mentioned at ${t.mentioned.toFixed(2)} or more was considered and `
    + `set aside, which is why declining a CT produces no nudge.`);

  const total = BUCKETS.reduce((n, b) => n + (r[b] ?? []).length, 0);
  h(`Where all ${total} orders landed`);
  pre(BUCKETS
    .map(b => `${b.padEnd(13)}${String((r[b] ?? []).length).padStart(2)}   ${BUCKET_RULES[b]}`)
    .join("\n"));

  h(`What the model was asked, for ${r.asked.order.label}`);
  p(`Verbatim, as sent. The order is described to the model in clinical words rather `
    + `than by its code, and the false case is spelled out because that is where `
    + `"mentioned but declined" has to land.`);
  pre(JSON.stringify(r.asked.committed, null, 1), true);
  pre(JSON.stringify(r.asked.mentioned, null, 1), true);

  h("Finding the sentence");
  p(`A second request asks which sentence carries each commitment. The options are the `
    + `note's own sentences, so the answer is picked from the text and never written. `
    + `The runners-up show whether it was decisive.`);
  pre(JSON.stringify(r.asked.locate, null, 1), true);
  const ranked = (r.missing[0] ?? r.matched.find(x => x.locate_top));
  if (ranked?.locate_top) {
    pre(`${ranked.label}\n` + ranked.locate_top
      .map(([sid, prob], i) => `  ${i === 0 ? "chosen " : "       "}${sid.padEnd(4)}${prob.toFixed(3)}`)
      .join("\n"));
  }

  h("Cost of one check");
  p(`${r.meta.stage1_questions} questions in one request, then ${r.meta.stage2_questions} in a `
    + `second, for ${r.meta.input_tokens.toLocaleString()} input tokens. At $0.042 per million `
    + `input tokens, and no charge for output, that is about `
    + `$${(r.meta.input_tokens * 0.042 / 1e6).toFixed(4)}.`);

  d.append(body);
  host.append(d);
}

function renderMeta() {
  const m = state.result.meta;
  const host = document.getElementById("meta");
  host.hidden = false;
  host.textContent = "";
  const parts = [
    ["model", m.model],
    ["questions", `${m.stage1_questions} then ${m.stage2_questions}`],
    ["latency", `${m.stage1_ms} + ${m.stage2_ms} ms`],
    ["input", `${m.input_tokens.toLocaleString()} tokens`],
  ];
  parts.forEach(([k, v]) => {
    const row = el("div");
    row.style.display = "flex";
    row.style.justifyContent = "space-between";
    row.style.gap = "18px";
    const a = el("span"); a.textContent = k; a.style.color = "#8fa79b";
    const b = el("span"); b.textContent = v;
    row.append(a, b);
    host.append(row);
  });
}

// ---- run ------------------------------------------------------------------
const checkBtn = document.getElementById("check-btn");
const editBtn = document.getElementById("edit-btn");

function showError(message) {
  const host = document.getElementById("nudge-host");
  host.textContent = "";
  const p = el("p", "err");
  p.textContent = message;
  host.append(p);
}

function show(result, { editable }) {
  state.result = result;
  state.result.matched ??= [];
  state.mode = "reviewed";
  renderNote(); renderChart(); renderNudge(); renderDeclined(); renderExplainer(); renderMeta();
  editBtn.hidden = !editable;
}

checkBtn.addEventListener("click", async () => {
  if (!state.live) {
    show(state.recorded.check, { editable: false });
    checkBtn.disabled = true;
    checkBtn.textContent = "Saved check shown";
    return;
  }
  if (state.needsKey && !state.apiKey) {
    showError("Paste a TypeSafe key above, then check.");
    document.getElementById("key-input")?.focus();
    return;
  }
  checkBtn.disabled = true;
  checkBtn.textContent = "Checking…";
  try {
    const body = { note: state.note, placed: state.placed };
    if (state.apiKey) body.api_key = state.apiKey;
    const res = await fetch("/api/check", {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await res.json();
    if (data.error) { showError(data.error); return; }
    show(data, { editable: true });
  } finally {
    checkBtn.disabled = false;
    checkBtn.textContent = "Check again";
  }
});

editBtn.addEventListener("click", () => {
  state.mode = "edit";
  state.result = null;
  editBtn.hidden = true;
  checkBtn.textContent = "Check note against orders";
  document.getElementById("nudge-host").classList.remove("resolved");
  document.getElementById("nudge-host").innerHTML =
    '<p class="empty">Note edited. Check it again to reconcile against the chart.</p>';
  document.getElementById("declined-host").hidden = true;
  document.getElementById("explain-host").hidden = true;
  document.getElementById("meta").hidden = true;
  renderNote(); renderChart();
});
</script>
</body>
</html>
